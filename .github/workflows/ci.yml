name: CI

# Runs only when started by hand: from the Actions page, or with
# `gh workflow run ci.yml --ref <branch>`.
on:
  workflow_dispatch:

jobs:
  firmware-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve JSOScope-device revision
        id: device_library
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:lib/jsoscope-device)" >> "$GITHUB_OUTPUT"
      - name: Check out JSOScope-device
        uses: actions/checkout@v7
        with:
          repository: DariusGeorgeLukas/JSOScope-device
          ref: ${{ steps.device_library.outputs.sha }}
          path: lib/jsoscope-device
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - run: ./scripts/test-firmware-host.sh

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve JSOScope-device revision
        id: device_library
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:lib/jsoscope-device)" >> "$GITHUB_OUTPUT"
      - name: Check out JSOScope-device
        uses: actions/checkout@v7
        with:
          repository: DariusGeorgeLukas/JSOScope-device
          ref: ${{ steps.device_library.outputs.sha }}
          path: lib/jsoscope-device
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Install Arm GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stm32f103-jsoscope-firmware
          path: |
            firmware/build/stm32f103_jsoscope.bin
            firmware/build/stm32f103_jsoscope.hex
            firmware/build/stm32f103_jsoscope.elf
